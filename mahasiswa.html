<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Mahasiswa | SIPINJAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="sidebar-slot"></div>
  <div class="main">
    <div id="topbar-slot"></div>
    <main class="container-fluid p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h4 class="page-title">Master Mahasiswa</h4>
          <p class="text-muted mb-0">Kelola data mahasiswa peminjam.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd"><i class="bi bi-person-plus me-1"></i>Tambah Mahasiswa</button>
      </div>

      <div class="card">
        <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <span class="fw-semibold">Daftar Mahasiswa <span class="badge text-bg-light" id="count">0</span></span>
          <div class="d-flex gap-2">
            <div class="input-group input-group-sm" style="width:240px">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="search" placeholder="Cari NIM / nama...">
            </div>
            <button class="btn btn-sm btn-light" id="btnReload" title="Muat ulang"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead><tr>
              <th>No</th><th>NIM</th><th>Nama</th><th>Jurusan</th><th class="text-center">Angkatan</th>
              <th>Email</th><th>Telepon</th><th class="text-end">Aksi</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Form -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="formTitle">Tambah Mahasiswa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" data-type="number">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">NIM <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="nim" required pattern="[0-9]{5,20}" placeholder="cth: 210101003">
              <div class="invalid-feedback">NIM wajib diisi (angka, 5–20 digit).</div>
            </div>
            <div class="col-md-8">
              <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="nama" required placeholder="cth: Budi Santoso">
              <div class="invalid-feedback">Nama wajib diisi.</div>
            </div>
            <div class="col-md-8">
              <label class="form-label">Jurusan <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="jurusan" list="jurusanList" required placeholder="cth: Teknik Informatika">
              <datalist id="jurusanList">
                <option value="Teknik Informatika"><option value="Teknik Komputer"><option value="Sistem Informasi"><option value="Manajemen Informatika">
              </datalist>
              <div class="invalid-feedback">Jurusan wajib diisi.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Angkatan <span class="text-danger">*</span></label>
              <input type="number" class="form-control" name="angkatan" min="2000" max="2100" required placeholder="cth: 2022">
              <div class="invalid-feedback">Angkatan wajib diisi (tahun).</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" name="email" required placeholder="nama@example.com">
              <div class="invalid-feedback">Masukkan email yang valid.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Telepon <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" name="telepon" required pattern="[0-9+]{8,15}" placeholder="08xxxxxxxxxx">
              <div class="invalid-feedback">Nomor telepon 8–15 digit.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSave"><i class="bi bi-save me-1"></i>Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderLayout('mahasiswa');

    const tbody = document.getElementById('tbody');
    const form = document.getElementById('form');
    const modal = new bootstrap.Modal('#formModal');
    const COLS = 8;
    let rows = [];

    const LABELS = { id: 'ID', nim: 'NIM', nama: 'Nama', jurusan: 'Jurusan', angkatan: 'Angkatan',
                     email: 'Email', telepon: 'Telepon', created_at: 'Dibuat' };

    async function load() {
      setTableState(tbody, COLS, 'loading');
      try {
        rows = await apiList('/mahasiswa/read.php');
        render();
      } catch (e) {
        setTableState(tbody, COLS, 'error', e.message);
      }
    }

    function render() {
      const data = filterRows(rows, document.getElementById('search').value);
      document.getElementById('count').textContent = data.length;
      if (!data.length) return setTableState(tbody, COLS, 'empty', rows.length ? 'Tidak ada hasil pencarian' : '');
      tbody.innerHTML = data.map((r, i) => {
        const id = pickId(r, ['id', 'id_mahasiswa']);
        return `<tr>
          <td>${i + 1}</td>
          <td><span class="badge text-bg-light border">${esc(r.nim)}</span></td>
          <td class="fw-medium">${esc(r.nama)}</td>
          <td>${esc(r.jurusan)}</td>
          <td class="text-center">${esc(r.angkatan)}</td>
          <td><a href="mailto:${esc(r.email)}" class="text-decoration-none">${esc(r.email)}</a></td>
          <td>${esc(r.telepon)}</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-light btn-icon" title="Detail" onclick="detail('${esc(id)}')"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-light btn-icon text-primary" title="Edit" onclick="edit('${esc(id)}')"><i class="bi bi-pencil-square"></i></button>
            <button class="btn btn-sm btn-light btn-icon text-danger" title="Hapus" onclick="hapus('${esc(id)}')"><i class="bi bi-trash"></i></button>
          </td></tr>`;
      }).join('');
    }

    function findLocal(id) { return rows.find(r => String(pickId(r, ['id', 'id_mahasiswa'])) === String(id)); }

    async function fetchDetail(id) {
      try { return toItem(await api(`/mahasiswa/detail.php?id=${encodeURIComponent(id)}`)) || findLocal(id); }
      catch { return findLocal(id); }
    }

    async function detail(id) {
      showDetail('Detail Mahasiswa', await fetchDetail(id), LABELS);
    }

    document.getElementById('btnAdd').onclick = () => {
      fillForm(form, {});
      form.elements['id'].value = '';
      document.getElementById('formTitle').textContent = 'Tambah Mahasiswa';
      modal.show();
    };

    async function edit(id) {
      const d = await fetchDetail(id);
      if (!d) return toast('Data tidak ditemukan', 'danger');
      fillForm(form, { ...d, id: pickId(d, ['id', 'id_mahasiswa']) });
      document.getElementById('formTitle').textContent = 'Edit Mahasiswa';
      modal.show();
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!form.checkValidity()) return form.classList.add('was-validated');
      const body = readForm(form);
      const isEdit = !!body.id;
      const btn = document.getElementById('btnSave');
      setBusy(btn, true);
      try {
        const res = await api(isEdit ? '/mahasiswa/update.php' : '/mahasiswa/create.php', { method: 'POST', body });
        toast(res.message || (isEdit ? 'Mahasiswa berhasil diperbarui' : 'Mahasiswa berhasil ditambahkan'));
        modal.hide();
        load();
      } catch (err) {
        toast(err.message, 'danger');
      } finally {
        setBusy(btn, false);
      }
    });

    async function hapus(id) {
      const d = findLocal(id);
      if (!await confirmDialog(`Hapus mahasiswa "${d?.nama || id}"?`)) return;
      try {
        const res = await api(`/mahasiswa/delete.php?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        toast(res.message || 'Mahasiswa berhasil dihapus');
        load();
      } catch (err) {
        toast(err.message, 'danger');
      }
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('btnReload').onclick = load;
    load();
  </script>
</body>
</html>
