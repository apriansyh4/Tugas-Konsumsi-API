<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaksi Peminjaman | SIPINJAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="sidebar-slot"></div>
  <div class="main">
    <div id="topbar-slot"></div>
    <main class="container-fluid p-3 p-lg-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h4 class="page-title">Transaksi Peminjaman</h4>
          <p class="text-muted mb-0">Catat dan lihat riwayat peminjaman asset oleh mahasiswa.</p>
        </div>
        <button class="btn btn-primary" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Peminjaman Baru</button>
      </div>

      <div class="card">
        <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
          <span class="fw-semibold">Riwayat Peminjaman <span class="badge text-bg-light" id="count">0</span></span>
          <div class="d-flex flex-wrap gap-2">
            <select class="form-select form-select-sm" id="filterStatus" style="width:160px">
              <option value="">Semua Status</option>
            </select>
            <div class="input-group input-group-sm" style="width:220px">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control" id="search" placeholder="Cari...">
            </div>
            <button class="btn btn-sm btn-light" id="btnReload" title="Muat ulang"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead><tr>
              <th>ID</th><th>Mahasiswa</th><th>Asset</th><th class="text-center">Jumlah</th>
              <th>Tgl Pinjam</th><th>Tgl Kembali</th><th>Keterangan</th><th>Status</th><th class="text-end">Aksi</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Form Create -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-arrow-left-right me-2"></i>Peminjaman Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Mahasiswa <span class="text-danger">*</span></label>
              <select class="form-select" name="id_mahasiswa" data-type="number" required>
                <option value="">Memuat...</option>
              </select>
              <div class="invalid-feedback">Pilih mahasiswa.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Asset <span class="text-danger">*</span></label>
              <select class="form-select" name="id_asset" data-type="number" required>
                <option value="">Memuat...</option>
              </select>
              <div class="form-text" id="stokInfo"></div>
              <div class="invalid-feedback">Pilih asset.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Jumlah <span class="text-danger">*</span></label>
              <input type="number" class="form-control" name="jumlah" min="1" value="1" required>
              <div class="invalid-feedback" id="jumlahFeedback">Jumlah minimal 1.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tanggal Pinjam <span class="text-danger">*</span></label>
              <input type="date" class="form-control" name="tanggal_pinjam" required>
              <div class="invalid-feedback">Tanggal pinjam wajib diisi.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tanggal Kembali <span class="text-danger">*</span></label>
              <input type="date" class="form-control" name="tanggal_kembali" required>
              <div class="invalid-feedback">Harus sama/setelah tanggal pinjam.</div>
            </div>
            <div class="col-md-8">
              <label class="form-label">Keterangan</label>
              <input type="text" class="form-control" name="keterangan" placeholder="cth: Untuk Presentasi Tugas Akhir">
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" name="status_peminjaman">
                <option>Pending</option><option>Dipinjam</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSave"><i class="bi bi-save me-1"></i>Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderLayout('peminjaman');

    const tbody = document.getElementById('tbody');
    const form = document.getElementById('form');
    const modal = new bootstrap.Modal('#formModal');
    const COLS = 9;
    let rows = [], mahasiswa = [], assets = [], mhsMap = {}, assetMap = {};

    const mhsId = r => String(pickId(r, ['id', 'id_mahasiswa']));
    const assetId = r => String(pickId(r, ['id', 'id_asset']));
    const pjId = r => pickId(r, ['id_peminjaman', 'id']);
    const namaMhs = r => r.nama_mahasiswa || r.nama || mhsMap[r.id_mahasiswa]?.nama || `ID ${r.id_mahasiswa}`;
    const nimMhs = r => r.nim || mhsMap[r.id_mahasiswa]?.nim || '';
    const namaAsset = r => r.nama_asset || assetMap[r.id_asset]?.nama_asset || `ID ${r.id_asset}`;

    async function loadMaster() {
      const [m, a] = await Promise.allSettled([apiList('/mahasiswa/read.php'), apiList('/asset/read.php')]);
      mahasiswa = m.status === 'fulfilled' ? m.value : [];
      assets = a.status === 'fulfilled' ? a.value : [];
      mhsMap = Object.fromEntries(mahasiswa.map(x => [mhsId(x), x]));
      assetMap = Object.fromEntries(assets.map(x => [assetId(x), x]));

      form.id_mahasiswa.innerHTML = '<option value="">-- Pilih Mahasiswa --</option>' +
        mahasiswa.map(x => `<option value="${esc(mhsId(x))}">${esc(x.nim)} — ${esc(x.nama)}</option>`).join('');
      form.id_asset.innerHTML = '<option value="">-- Pilih Asset --</option>' +
        assets.map(x => {
          const st = String(x.status || '').trim().toLowerCase();
          const unavailable = Number(x.jumlah) <= 0 || (st !== '' && st !== 'tersedia');
          return `<option value="${esc(assetId(x))}" ${unavailable ? 'disabled' : ''}>
            ${esc(x.nama_asset)} (stok: ${esc(x.jumlah)})${unavailable ? ' — ' + esc(x.status || 'tidak tersedia') : ''}</option>`;
        }).join('');
    }

    async function load() {
      setTableState(tbody, COLS, 'loading');
      try {
        await loadMaster();
        rows = await apiList('/peminjaman/read.php');
        const statuses = [...new Set(rows.map(r => r.status_peminjaman).filter(Boolean))];
        const sel = document.getElementById('filterStatus');
        const cur = sel.value;
        sel.innerHTML = '<option value="">Semua Status</option>' + statuses.map(s => `<option>${esc(s)}</option>`).join('');
        sel.value = statuses.includes(cur) ? cur : '';
        render();
      } catch (e) {
        setTableState(tbody, COLS, 'error', e.message);
      }
    }

    function render() {
      const st = document.getElementById('filterStatus').value;
      let data = rows.map(r => ({ ...r, _mhs: namaMhs(r), _nim: nimMhs(r), _asset: namaAsset(r) }));
      if (st) data = data.filter(r => r.status_peminjaman === st);
      data = filterRows(data, document.getElementById('search').value);
      data.sort((a, b) => Number(pjId(b)) - Number(pjId(a)));
      document.getElementById('count').textContent = data.length;
      if (!data.length) return setTableState(tbody, COLS, 'empty', rows.length ? 'Tidak ada hasil' : '');
      tbody.innerHTML = data.map(r => `<tr>
        <td>#${esc(pjId(r))}</td>
        <td><div class="fw-medium">${esc(r._mhs)}</div><div class="small text-muted">${esc(r._nim)}</div></td>
        <td>${esc(r._asset)}</td>
        <td class="text-center">${esc(r.jumlah)}</td>
        <td class="text-nowrap">${formatDate(r.tanggal_pinjam)}</td>
        <td class="text-nowrap">${formatDate(r.tanggal_kembali)}</td>
        <td class="text-truncate" style="max-width:200px" title="${esc(r.keterangan)}">${esc(r.keterangan || '-')}</td>
        <td>${statusBadge(r.status_peminjaman)}</td>
        <td class="text-end"><button class="btn btn-sm btn-light btn-icon" title="Detail" onclick="detail('${esc(pjId(r))}')"><i class="bi bi-eye"></i></button></td>
      </tr>`).join('');
    }

    // ---- READ detail
    async function detail(id) {
      let d;
      try { d = toItem(await api(`/peminjaman/detail.php?id_peminjaman=${encodeURIComponent(id)}`)); } catch {}
      if (!d) d = rows.find(r => String(pjId(r)) === String(id));
      if (!d) return toast('Data tidak ditemukan', 'danger');
      const view = {
        id_peminjaman: pjId(d),
        mahasiswa: `${namaMhs(d)}${nimMhs(d) ? ' (' + nimMhs(d) + ')' : ''}`,
        jurusan: d.jurusan || mhsMap[d.id_mahasiswa]?.jurusan || '-',
        asset: namaAsset(d),
        kategori_asset: d.kategori_asset || assetMap[d.id_asset]?.kategori || '-',
        jumlah: d.jumlah,
        tanggal_pinjam: d.tanggal_pinjam,
        tanggal_kembali: d.tanggal_kembali,
        keterangan: d.keterangan,
        status_peminjaman: d.status_peminjaman,
        created_at: d.created_at || '-',
      };
      showDetail('Detail Peminjaman', view,
        { id_peminjaman: 'ID Peminjaman', mahasiswa: 'Mahasiswa', jurusan: 'Jurusan', asset: 'Asset', kategori_asset: 'Kategori Asset', jumlah: 'Jumlah',
          tanggal_pinjam: 'Tanggal Pinjam', tanggal_kembali: 'Tanggal Kembali', keterangan: 'Keterangan', status_peminjaman: 'Status', created_at: 'Dicatat' },
        { tanggal_pinjam: formatDate, tanggal_kembali: formatDate, status_peminjaman: statusBadge });
    }

    // ---- CREATE
    document.getElementById('btnAdd').onclick = () => {
      form.reset();
      form.classList.remove('was-validated');
      form.tanggal_pinjam.value = today();
      form.tanggal_kembali.min = today();
      document.getElementById('stokInfo').textContent = '';
      modal.show();
    };

    form.id_asset.addEventListener('change', () => {
      const a = assetMap[form.id_asset.value];
      document.getElementById('stokInfo').textContent = a ? `Stok tersedia: ${a.jumlah} • Lokasi: ${a.lokasi || '-'}` : '';
      form.jumlah.max = a ? a.jumlah : '';
      document.getElementById('jumlahFeedback').textContent = a ? `Jumlah 1 – ${a.jumlah}.` : 'Jumlah minimal 1.';
    });
    form.tanggal_pinjam.addEventListener('change', () => { form.tanggal_kembali.min = form.tanggal_pinjam.value; });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const tp = form.tanggal_pinjam.value, tk = form.tanggal_kembali.value;
      form.tanggal_kembali.setCustomValidity(tp && tk && tk < tp ? 'invalid' : '');
      if (!form.checkValidity()) return form.classList.add('was-validated');

      const body = readForm(form);
      const btn = document.getElementById('btnSave');
      setBusy(btn, true);
      try {
        const res = await api('/peminjaman/create.php', { method: 'POST', body });
        toast(res.message || 'Peminjaman berhasil disimpan');
        modal.hide();
        load();
      } catch (err) {
        toast(err.message, 'danger');
      } finally {
        setBusy(btn, false);
      }
    });

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filterStatus').addEventListener('change', render);
    document.getElementById('btnReload').onclick = load;
    load();
  </script>
</body>
</html>
