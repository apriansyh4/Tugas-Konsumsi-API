<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | SIPINJAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="sidebar-slot"></div>
  <div class="main">
    <div id="topbar-slot"></div>
    <main class="container-fluid p-3 p-lg-4">
      <h4 class="page-title">Dashboard</h4>
      <p class="text-muted">Ringkasan data asset, mahasiswa, dan peminjaman.</p>

      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-box-seam"></i></div>
          <div><div class="text-muted small">Total Asset</div><div class="stat-value" id="stAsset">-</div></div>
        </div></div></div>
        <div class="col-sm-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-people"></i></div>
          <div><div class="text-muted small">Total Mahasiswa</div><div class="stat-value" id="stMhs">-</div></div>
        </div></div></div>
        <div class="col-sm-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-info-subtle text-info"><i class="bi bi-arrow-left-right"></i></div>
          <div><div class="text-muted small">Total Peminjaman</div><div class="stat-value" id="stPinjam">-</div></div>
        </div></div></div>
        <div class="col-sm-6 col-xl-3"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-hourglass-split"></i></div>
          <div><div class="text-muted small">Peminjaman Pending</div><div class="stat-value" id="stPending">-</div></div>
        </div></div></div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-semibold">Peminjaman Terbaru</span>
          <a href="peminjaman.html" class="btn btn-sm btn-outline-primary">Lihat Semua</a>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Mahasiswa</th><th>Asset</th><th>Tgl Pinjam</th><th>Status</th></tr></thead>
            <tbody id="tbLatest"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderLayout('dashboard');
    const tb = document.getElementById('tbLatest');
    setTableState(tb, 5, 'loading');

    (async () => {
      const [asset, mhs, pinjam] = await Promise.allSettled([
        apiList('/asset/read.php'), apiList('/mahasiswa/read.php'), apiList('/peminjaman/read.php'),
      ]);
      const val = r => r.status === 'fulfilled' ? r.value : null;
      const a = val(asset), m = val(mhs), p = val(pinjam);
      document.getElementById('stAsset').textContent  = a ? a.length : '!';
      document.getElementById('stMhs').textContent    = m ? m.length : '!';
      document.getElementById('stPinjam').textContent = p ? p.length : '!';
      document.getElementById('stPending').textContent =
        p ? p.filter(x => String(x.status_peminjaman).toLowerCase() === 'pending').length : '!';

      if (!p) return setTableState(tb, 5, 'error', pinjam.reason.message);
      if (!p.length) return setTableState(tb, 5, 'empty');

      const mhsMap = Object.fromEntries((m || []).map(x => [String(pickId(x, ['id', 'id_mahasiswa'])), x]));
      const assetMap = Object.fromEntries((a || []).map(x => [String(pickId(x, ['id', 'id_asset'])), x]));
      const latest = [...p].sort((x, y) => Number(pickId(y, ['id_peminjaman', 'id'])) - Number(pickId(x, ['id_peminjaman', 'id']))).slice(0, 5);
      tb.innerHTML = latest.map(r => `<tr>
        <td>${esc(pickId(r, ['id_peminjaman', 'id']))}</td>
        <td>${esc(r.nama_mahasiswa || r.nama || mhsMap[r.id_mahasiswa]?.nama || 'ID ' + r.id_mahasiswa)}</td>
        <td>${esc(r.nama_asset || assetMap[r.id_asset]?.nama_asset || 'ID ' + r.id_asset)}</td>
        <td>${formatDate(r.tanggal_pinjam)}</td>
        <td>${statusBadge(r.status_peminjaman)}</td></tr>`).join('');
    })();
  </script>
</body>
</html>
